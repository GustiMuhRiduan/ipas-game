<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e7c86" />
  <title>Petualangan Energi — Game Edukasi IPAS</title>
  <meta name="description" content="Game edukasi IPAS Fase C (Kelas 5-6 SD): hemat energi, energi alternatif, dan ekonomi hijau masyarakat." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
</head>
<body>
  <!-- Loading splash shown until Phaser boots -->
  <div id="preloader" aria-hidden="true">
    <div class="preloader-badge">⚡</div>
    <div class="preloader-title">Petualangan Energi</div>
    <div class="preloader-sub">Menyiapkan permainan…</div>
    <div class="preloader-bar"><span></span></div>
  </div>

  <!-- Rotate hint for portrait phones/tablets -->
  <div id="rotate-hint">
    <div class="rotate-icon">🔄</div>
    <p>Putar perangkatmu ke posisi <strong>mendatar</strong> (landscape) untuk bermain.</p>
  </div>

  <!-- Phaser mounts its canvas here -->
  <div id="game-root"></div>

  <script src="vendor/phaser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/managers/AudioManager.js"></script>
  <script src="js/managers/Progress.js"></script>
  <script src="js/ui/UI.js"></script>
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/MenuScene.js"></script>
  <script src="js/scenes/GuideScene.js"></script>
  <script src="js/scenes/LevelSelectScene.js"></script>
  <script src="js/scenes/HudScene.js"></script>
  <script src="js/scenes/LevelBase.js"></script>
  <script src="js/scenes/Level1Scene.js"></script>
  <script src="js/scenes/Level2Scene.js"></script>
  <script src="js/scenes/Level3Scene.js"></script>
  <script src="js/scenes/ResultScene.js"></script>
  <script src="js/scenes/FinishScene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
